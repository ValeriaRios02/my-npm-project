server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: backend-server

  datasource:
    url: jdbc:postgresql://localhost:5432/appdb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    mongodb:
      uri: mongodb://localhost:27017/appdb
    redis:
      host: localhost
      port: 6379

cloud:
  aws:
    region:
      static: us-east-1
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}

jwt:
  secret: ${JWT_SECRET:your-secret-key}
  expiration: 86400000

logging:
  level:
    root: INFO
    com.example: DEBUG
